# Spokane County ARES-ACS: the single facts file for the spokares.org rebuild
#
# One editable source for the facts every page repeats (names, leadership, nets,
# meetings, infrastructure, joining, channels, domain). history.md §10 item 2 and
# decisions.md D9 call for this. decisions.md D13 is the human checklist; each row
# here that answers a D13 row names it in `d13`.
#
# Created 2026-09-25, seeded from organization.md (§1, §4, §8-§12), decisions.md
# D2-D4 and D13, and the re-checks made on 2026-09-25. Paths are relative to research/.
#
# Rules (research/README.md): cite a source for every value; never invent names,
# callsigns, frequencies, dates or times; no personal phone numbers, home addresses
# or personal e-mails (role + name + callsign is fine).
#
# Fields
#   id               stable key (use it in templates)
#   value            the value to render; null when unknown
#   status           verified      re-checked against a primary source on last_verified
#                    multi-source  two or more independent sources agree; not confirmed by the group
#                    single-source one source only
#                    conflict      sources disagree; see notes and the d13 row
#                    unknown       no source
#   publish          "yes" | "no" | after-confirmation   ("no" = never on the public site; quoted so YAML 1.1 parsers keep them as strings)
#   sources          file paths (relative to research/) or URLs
#   owner            the role that confirms or changes it (decisions.md "Roles used below")
#   last_verified    date the value was last checked against its source (YYYY-MM-DD)
#   confirmed_by_group  true only after the owner has confirmed it. Nobody has been asked yet.
#   d13              the decisions.md D13 row it answers, if any
#   notes            anything a verifier needs

