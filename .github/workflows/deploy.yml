# Deploy our code (theme spokares, plugin spokares-core, must-use plugin
# spokares-hardening) to the Verpex/Enhance site over SSH with
# wordpress/ops/deploy.sh (PLAN.md §5.7): a clean export of one commit, code
# only, never dev/, tools/, uploads or the database. Then ops/check-live.sh.
#
#   - on a pushed tag v*  (a release: the version strings must equal the tag)
#   - by hand: Actions > Deploy > Run workflow, or
#       gh workflow run deploy.yml -f ref=<main|v* tag>
#     (any other branch or a bare commit is refused by the check-ref job)
#
# The ci.sh gate (ci.yml) runs first on the same commit. Secrets live in the
# GitHub environment "production" (DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS,
# DEPLOY_HOST, DEPLOY_USER, DEPLOY_PORT, DEPLOY_PATH), which only main and v*
# tags may use. Runbook: wordpress/ops/DEPLOY-RUNBOOK.md.
name: Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Tag, branch or commit to deploy
        type: string
        required: true
        default: main
      flush_rewrites:
        description: Flush rewrite rules (routes, post types or the /docs/ rule changed)
        type: boolean
        default: false

permissions:
  contents: read

# One deploy at a time; a queued one waits, it is never cancelled half-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Only main or a v* release tag may reach production. The environment's
  # branch rule checks the branch the workflow runs from, not the `ref` input,
  # so the input is checked here and turned into a full ref (refs/heads/main or
  # refs/tags/<tag>) so a branch named like a tag can't stand in for it.
  check-ref:
    name: Check the ref
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - name: Only main or a v* tag
        id: ref
        env:
          EVENT: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          GH_REF: ${{ github.ref }}
        run: |
          if [[ $EVENT == workflow_dispatch ]]; then
            case $INPUT_REF in
              main | refs/heads/main) ref=refs/heads/main ;;
              *)
                name=${INPUT_REF#refs/tags/}
                [[ $name =~ ^v[0-9][0-9A-Za-z.+-]*$ ]] || { echo "::error::refusing to deploy '$INPUT_REF': only main or a v* release tag (e.g. v0.1.0) may be deployed"; exit 1; }
                ref=refs/tags/$name
                ;;
            esac
          else
            [[ $GH_REF =~ ^refs/tags/v[0-9] ]] || { echo "::error::unexpected ref $GH_REF"; exit 1; }
            ref=$GH_REF
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Deploying $ref"

  gate:
    name: Gate
    needs: check-ref
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.check-ref.outputs.ref }}

  deploy:
    name: Deploy to production
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      SHA: ${{ needs.gate.outputs.sha }}
      TAG: ${{ needs.gate.outputs.tag }}
      FLUSH_REWRITES: ${{ inputs.flush_rewrites && 'yes' || '' }}
    steps:
      - name: Check out the gated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Secrets go from the environment into files with printf, never onto a
      # command line and never echoed; no `set -x` anywhere in this job.
      - name: Set up SSH (deploy key, pinned host key)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          for v in DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_HOST DEPLOY_USER DEPLOY_PORT DEPLOY_PATH; do
            [[ -n ${!v} ]] || { echo "::error::secret $v is not set in the production environment"; exit 1; }
          done
          [[ $DEPLOY_PORT =~ ^[0-9]+$ ]] || { echo "::error::DEPLOY_PORT is not a number"; exit 1; }
          [[ $DEPLOY_HOST =~ ^[A-Za-z0-9.:-]+$ && $DEPLOY_USER =~ ^[A-Za-z0-9._-]+$ && $DEPLOY_PATH =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::DEPLOY_HOST, DEPLOY_USER or DEPLOY_PATH has unexpected characters"; exit 1; }
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/spokares_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/spokares_known_hosts
          # One multiplexed connection for the whole job: the host runs
          # fail2ban, which blocks rapid reconnects.
          cat > ~/.ssh/config <<EOF
          Host spokares-live
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port $DEPLOY_PORT
            IdentityFile ~/.ssh/spokares_deploy
            IdentitiesOnly yes
            UserKnownHostsFile ~/.ssh/spokares_known_hosts
            StrictHostKeyChecking yes
            BatchMode yes
            ControlMaster auto
            ControlPath ~/.ssh/cm-%C
            ControlPersist 900
            ServerAliveInterval 30
            ConnectTimeout 25
          EOF
          # ops.env for the ops scripts (no secrets in it).
          SPOKARES_OPS_ENV=$RUNNER_TEMP/ops.env
          echo "SPOKARES_OPS_ENV=$SPOKARES_OPS_ENV" >> "$GITHUB_ENV"
          {
            echo "SPOKARES_LIVE_SSH=spokares-live"
            echo "SPOKARES_LIVE_URL=https://spokares.org"
            echo "SPOKARES_WP_PATH=$DEPLOY_PATH"
          } > "$SPOKARES_OPS_ENV"
          ssh spokares-live 'echo "connected as $(whoami); wp-cli $(wp --version 2>/dev/null | cut -d" " -f2)"'

      - name: Deploy (wordpress/ops/deploy.sh)
        run: |
          args=(production --yes)
          [[ -n $FLUSH_REWRITES ]] && args+=(--flush-rewrites)
          wordpress/ops/deploy.sh "${TAG:-$SHA}" "${args[@]}"

      # Before the DNS cutover spokares.org still resolves to the old host, so
      # the curl checks are pinned to the server (curl --resolve, -k for its
      # self-signed certificate until Let's Encrypt is issued). Once DNS points
      # at the server, the pin drops out by itself and the certificate is verified.
      - name: Check the site (wordpress/ops/check-live.sh)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          args=()
          if [[ $(getent ahostsv4 spokares.org | awk 'NR == 1 { print $1 }') != "$DEPLOY_HOST" ]]; then
            args+=(--resolve="$DEPLOY_HOST")
          fi
          wordpress/ops/check-live.sh "${TAG:-$SHA}" "${args[@]}"

      - name: Close SSH and remove the key
        if: always()
        run: |
          ssh -O exit spokares-live 2>/dev/null || true
          rm -f ~/.ssh/spokares_deploy ~/.ssh/config
