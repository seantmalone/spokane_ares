<path class="wf-edge" d="M549.0,702.0 L549.0,736.0" marker-end="url(#arr-docreview)"/>
<g class="wf-node wf-start" data-node="s"><circle class="wf-solid" cx="549.0" cy="77.0" r="11.0"/></g>
<g class="wf-node wf-action" data-node="dash"><rect class="wf-act wf-act-system" x="459.0" y="122" width="180" height="74" rx="9"/><text class="wf-text" x="549.0" y="140.5" text-anchor="middle">Dashboard: &#x27;N not</text><text class="wf-text" x="549.0" y="155.5" text-anchor="middle">reviewed in 12 months&#x27;</text><text class="wf-text" x="549.0" y="170.5" text-anchor="middle">(published and checked</text><text class="wf-text" x="549.0" y="185.5" text-anchor="middle">only)</text><circle class="wf-pain" cx="635.0" cy="124" r="10.5"/><text class="wf-paintext" x="635.0" y="127.8" text-anchor="middle">D3</text></g>
<g class="wf-node wf-action" data-node="list"><rect class="wf-act wf-act-human" x="31.0" y="230" width="180" height="59" rx="9"/><text class="wf-text" x="121.0" y="248.5" text-anchor="middle">Click → full list sorted</text><text class="wf-text" x="121.0" y="263.5" text-anchor="middle">oldest first; drafts and</text><text class="wf-text" x="121.0" y="278.5" text-anchor="middle">Soon also show red</text><circle class="wf-pain" cx="207.0" cy="232" r="10.5"/><text class="wf-paintext" x="207.0" y="235.8" text-anchor="middle">D3</text></g>
<g class="wf-node wf-decision" data-node="how"><path class="wf-dec" d="M121.0,323 L217.0,345.0 L121.0,367 L25.0,345.0 z"/><text class="wf-text" x="121.0" y="349.0" text-anchor="middle">Open each, or bulk?</text></g>
<g class="wf-node wf-action" data-node="open"><rect class="wf-act wf-act-human" x="31.0" y="401" width="180" height="59" rx="9"/><text class="wf-text" x="121.0" y="419.5" text-anchor="middle">Open it; More options ›</text><text class="wf-text" x="121.0" y="434.5" text-anchor="middle">Mark reviewed today</text><text class="wf-text" x="121.0" y="449.5" text-anchor="middle">(fills the box)</text></g>
<g class="wf-node wf-action" data-node="save"><rect class="wf-act wf-act-human" x="31.0" y="494" width="180" height="34" rx="9"/><text class="wf-text" x="121.0" y="515.0" text-anchor="middle">Click Save</text></g>
<g class="wf-node wf-action" data-node="bulk"><rect class="wf-act wf-act-human" x="245.0" y="401" width="180" height="59" rx="9"/><text class="wf-text" x="335.0" y="419.5" text-anchor="middle">Tick rows; Bulk action</text><text class="wf-text" x="335.0" y="434.5" text-anchor="middle">&#x27;Mark reviewed today&#x27;,</text><text class="wf-text" x="335.0" y="449.5" text-anchor="middle">without opening them</text><circle class="wf-pain" cx="421.0" cy="403" r="10.5"/><text class="wf-paintext" x="421.0" y="406.8" text-anchor="middle">D4</text></g>
<g class="wf-node wf-action" data-node="write"><rect class="wf-act wf-act-system" x="459.0" y="494" width="180" height="59" rx="9"/><text class="wf-text" x="549.0" y="512.5" text-anchor="middle">Write today&#x27;s date;</text><text class="wf-text" x="549.0" y="527.5" text-anchor="middle">&#x27;Marked N documents</text><text class="wf-text" x="549.0" y="542.5" text-anchor="middle">reviewed today&#x27;</text></g>
<g class="wf-node wf-merge" data-node="m"><path class="wf-dec" d="M549.0,587.0 L560.0,598.0 L549.0,609.0 L538.0,598.0 z"/></g>
<g class="wf-node wf-action" data-node="done"><rect class="wf-act wf-act-system" x="459.0" y="643" width="180" height="59" rx="9"/><text class="wf-text" x="549.0" y="661.5" text-anchor="middle">Reviewed column clears;</text><text class="wf-text" x="549.0" y="676.5" text-anchor="middle">the date is never shown</text><text class="wf-text" x="549.0" y="691.5" text-anchor="middle">on the site</text></g>
<g class="wf-node wf-end" data-node="x"><circle class="wf-ring" cx="549.0" cy="749.0" r="13.0"/><circle class="wf-solid" cx="549.0" cy="749.0" r="8.0"/></g>
<rect class="wf-guardbg" x="124.0" y="370.0" width="40.0" height="13" rx="2"/>
<text class="wf-guard" x="126.0" y="380.0" text-anchor="start">[open]</text>
<rect class="wf-guardbg" x="221.0" y="330.0" width="40.0" height="13" rx="2"/>
<text class="wf-guard" x="223.0" y="340.0" text-anchor="start">[bulk]</text>
