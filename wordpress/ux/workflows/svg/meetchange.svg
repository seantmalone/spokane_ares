<g class="wf-node wf-start" data-node="s"><circle class="wf-solid" cx="121.0" cy="77.0" r="11.0"/></g>
<g class="wf-node wf-action" data-node="post"><rect class="wf-act wf-act-external" x="31.0" y="122" width="180" height="59" rx="9"/><text class="wf-text" x="121.0" y="140.5" text-anchor="middle">Posts a cancellation,</text><text class="wf-text" x="121.0" y="155.5" text-anchor="middle">potluck or room change on</text><text class="wf-text" x="121.0" y="170.5" text-anchor="middle">groups.io</text></g>
<g class="wf-node wf-action" data-node="open"><rect class="wf-act wf-act-human" x="245.0" y="215" width="180" height="44" rx="9"/><text class="wf-text" x="335.0" y="233.5" text-anchor="middle">Open Cancel or Move a</text><text class="wf-text" x="335.0" y="248.5" text-anchor="middle">Meeting</text></g>
<g class="wf-node wf-action" data-node="list"><rect class="wf-act wf-act-system" x="673.0" y="293" width="180" height="74" rx="9"/><text class="wf-text" x="763.0" y="311.5" text-anchor="middle">List visible meetings:</text><text class="wf-text" x="763.0" y="326.5" text-anchor="middle">next 5 rule dates each,</text><text class="wf-text" x="763.0" y="341.5" text-anchor="middle">plus dates that already</text><text class="wf-text" x="763.0" y="356.5" text-anchor="middle">have a change</text><circle class="wf-pain" cx="849.0" cy="295" r="10.5"/><text class="wf-paintext" x="849.0" y="298.8" text-anchor="middle">M1</text></g>
<g class="wf-node wf-decision" data-node="listed"><path class="wf-dec" d="M335.0,401 L431.0,423.0 L335.0,445 L239.0,423.0 z"/><text class="wf-text" x="335.0" y="427.0" text-anchor="middle">Is the date listed?</text></g>
<g class="wf-node wf-final" data-node="f"><circle class="wf-ring wf-ringfill" cx="549.0" cy="423.0" r="12.0"/><path class="wf-x" d="M540.6,414.6 L557.4,431.4 M540.6,431.4 L557.4,414.6"/><text class="wf-cap" x="549.0" y="449.0" text-anchor="middle">Too far ahead, an extra</text><text class="wf-cap" x="549.0" y="464.0" text-anchor="middle">meeting, or meeting hidden:</text><text class="wf-cap" x="549.0" y="479.0" text-anchor="middle">nowhere to put it</text><circle class="wf-pain" cx="571.0" cy="415.0" r="10.5"/><text class="wf-paintext" x="571.0" y="418.8" text-anchor="middle">M2</text></g>
<g class="wf-node wf-action" data-node="set"><rect class="wf-act wf-act-human" x="245.0" y="508" width="180" height="59" rx="9"/><text class="wf-text" x="335.0" y="526.5" text-anchor="middle">Tick Cancelled, or pick</text><text class="wf-text" x="335.0" y="541.5" text-anchor="middle">Moved to, or type a Note</text><text class="wf-text" x="335.0" y="556.5" text-anchor="middle">only</text></g>
<g class="wf-node wf-action" data-node="save"><rect class="wf-act wf-act-human" x="245.0" y="601" width="180" height="34" rx="9"/><text class="wf-text" x="335.0" y="622.0" text-anchor="middle">Click Save</text></g>
<g class="wf-node wf-action" data-node="val"><rect class="wf-act wf-act-system" x="673.0" y="669" width="180" height="89" rx="9"/><text class="wf-text" x="763.0" y="687.5" text-anchor="middle">Moved-to not its own</text><text class="wf-text" x="763.0" y="702.5" text-anchor="middle">date, not past, not</text><text class="wf-text" x="763.0" y="717.5" text-anchor="middle">another rule date;</text><text class="wf-text" x="763.0" y="732.5" text-anchor="middle">changed by someone else?</text><text class="wf-text" x="763.0" y="747.5" text-anchor="middle">note checks</text></g>
<g class="wf-node wf-decision" data-node="ref"><path class="wf-dec" d="M763.0,792 L859.0,814.0 L763.0,836 L667.0,814.0 z"/><text class="wf-text" x="763.0" y="818.0" text-anchor="middle">Row refused?</text></g>
<g class="wf-node wf-action" data-node="hold"><rect class="wf-act wf-act-system" x="887.0" y="870" width="180" height="74" rx="9"/><text class="wf-text" x="977.0" y="888.5" text-anchor="middle">Row outlined red (a</text><text class="wf-text" x="977.0" y="903.5" text-anchor="middle">cancel or move still</text><text class="wf-text" x="977.0" y="918.5" text-anchor="middle">saves if only the note</text><text class="wf-text" x="977.0" y="933.5" text-anchor="middle">failed)</text></g>
<g class="wf-node wf-action" data-node="write"><rect class="wf-act wf-act-system" x="673.0" y="870" width="180" height="74" rx="9"/><text class="wf-text" x="763.0" y="888.5" text-anchor="middle">Drop changes older than</text><text class="wf-text" x="763.0" y="903.5" text-anchor="middle">365 days; save</text><text class="wf-text" x="763.0" y="918.5" text-anchor="middle">spk_meetings changes;</text><text class="wf-text" x="763.0" y="933.5" text-anchor="middle">purge cache</text></g>
<g class="wf-node wf-action" data-node="notice"><rect class="wf-act wf-act-system" x="673.0" y="978" width="180" height="59" rx="9"/><text class="wf-text" x="763.0" y="996.5" text-anchor="middle">Notice: &#x27;Saved: Sat, Dec</text><text class="wf-text" x="763.0" y="1011.5" text-anchor="middle">12 note posted…&#x27; + link</text><text class="wf-text" x="763.0" y="1026.5" text-anchor="middle">to Home</text></g>
<g class="wf-node wf-action" data-node="pub"><rect class="wf-act wf-act-external" x="1101.0" y="1071" width="180" height="59" rx="9"/><text class="wf-text" x="1191.0" y="1089.5" text-anchor="middle">Home &#x27;Next: … (Oct 3</text><text class="wf-text" x="1191.0" y="1104.5" text-anchor="middle">cancelled)&#x27;. For members:</text><text class="wf-text" x="1191.0" y="1119.5" text-anchor="middle">changes within 14 days</text></g>
<g class="wf-node wf-end" data-node="x"><circle class="wf-ring" cx="1191.0" cy="1177.0" r="13.0"/><circle class="wf-solid" cx="1191.0" cy="1177.0" r="8.0"/></g>
<rect class="wf-guardbg" x="338.0" y="448.0" width="34.0" height="13" rx="2"/>
<text class="wf-guard" x="340.0" y="458.0" text-anchor="start">[yes]</text>
<rect class="wf-guardbg" x="435.0" y="408.0" width="28.0" height="13" rx="2"/>
<text class="wf-guard" x="437.0" y="418.0" text-anchor="start">[no]</text>
<rect class="wf-guardbg" x="863.0" y="799.0" width="34.0" height="13" rx="2"/>
<text class="wf-guard" x="865.0" y="809.0" text-anchor="start">[yes]</text>
<rect class="wf-guardbg" x="766.0" y="839.0" width="28.0" height="13" rx="2"/>
<text class="wf-guard" x="768.0" y="849.0" text-anchor="start">[no]</text>
<g transform="rotate(-90 1078.0 722.2)"><rect class="wf-guardbg" x="1016.0" y="713.2" width="124.0" height="13" rx="2"/><text class="wf-guard" x="1078.0" y="723.2" text-anchor="middle">[fix and save again]</text></g>
</svg>
