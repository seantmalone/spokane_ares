stem-ui,-apple-system,sans-serif}.wf-edge{fill:none;stroke:#e6e8eb;stroke-width:1.2}.wf-edge-back{stroke-dasharray:5 3}.wf-arrowhead{fill:#e6e8eb}.wf-guardbg{fill:#15181c;opacity:.92}.wf-guard{fill:#9aa3ad;font:11px ui-monospace,SFMono-Regular,Menlo,monospace}.wf-pain{fill:#fb923c}.wf-paintext{fill:#1a1208;font:700 10.5px system-ui,-apple-system,sans-serif}}</style>
<rect class="wf-bg" x="0" y="0" width="884" height="1118"/>
<defs><marker id="arr-backups" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wf-arrowhead" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="wf-lane wf-lane-system" x="14" y="7.0" width="214" height="1104"/>
<rect class="wf-lanehead wf-lanehead-system" x="14" y="7.0" width="214" height="37.0"/>
<text class="wf-lanelabel" x="121.0" y="30.0" text-anchor="middle">UpdraftPlus (on the host)</text>
<rect class="wf-lane wf-lane-external" x="228" y="7.0" width="214" height="1104"/>
<rect class="wf-lanehead wf-lanehead-external" x="228" y="7.0" width="214" height="37.0"/>
<text class="wf-lanelabel" x="335.0" y="30.0" text-anchor="middle">AWS S3 bucket</text>
<rect class="wf-lane wf-lane-human" x="442" y="7.0" width="214" height="1104"/>
<rect class="wf-lanehead wf-lanehead-human" x="442" y="7.0" width="214" height="37.0"/>
<text class="wf-lanelabel" x="549.0" y="30.0" text-anchor="middle">Administrator (webmaster)</text>
<rect class="wf-lane wf-lane-system" x="656" y="7.0" width="214" height="1104"/>
<rect class="wf-lanehead wf-lanehead-system" x="656" y="7.0" width="214" height="37.0"/>
<text class="wf-lanelabel" x="763.0" y="30.0" text-anchor="middle">Verpex host</text>
<path class="wf-edge" d="M121.0,88.0 L121.0,122.0" marker-end="url(#arr-backups)"/>
<path class="wf-edge" d="M121.0,181.0 L121.0,198.0 L335.0,198.0 L335.0,215.0" marker-end="url(#arr-backups)"/>
<path class="wf-edge" d="M335.0,274.0 L335.0,324.5" marker-end="url(#arr-backups)"/>
<path class="wf-edge" d="M549.0,88.0 L549.0,122.0" marker-end="url(#arr-backups)"/>
<path class="wf-edge" d="M549.0,181.0 L549.0,198.0 L763.0,198.0 L763.0,215.0" marker-end="url(#arr-backups)"/>
<path class="wf-edge" d="M763.0,259.0 L763.0,291.0 L549.0,291.0 L549.0,308.0" marker-end="url(#arr-backups)"/>
<path class="wf-edge" d="M549.0,367.0 L549.0,401.0" marker-end="url(#arr-backups)"/>
<path class="wf-edge" d="M549.0,527.0 L549.0,561.0" marker-end="url(#arr-backups)"/>
<path class="wf-edge" d="M549.0,620.0 L549.0,637.0 L763.0,637.0 L763.0,654.0" marker-end="url(#arr-backups)"/>
<path class="wf-edge" d="M763.0,713.0 L763.0,747.0" marker-end="url(#arr-backups)"/>
<path class="wf-edge" d="M549.0,829.0 L549.0,863.0" marker-end="url(#arr-backups)"/>
<path class="wf-edge" d="M549.0,907.0 L549.0,941.0" marker-end="url(#arr-backups)"/>
<path class="wf-edge" d="M549.0,1015.0 L549.0,1049.0" marker-end="url(#arr-backups)"/>
<g class="wf-node wf-start" data-node="a0"><circle class="wf-solid" cx="121.0" cy="77.0" r="11.0"/></g>
<g class="wf-node wf-action" data-node="a1"><rect class="wf-act wf-act-system" x="31.0" y="122" width="180" height="59" rx="9"/><text class="wf-text" x="121.0" y="140.5" text-anchor="middle">Database weekly (keep 8),</text><text class="wf-text" x="121.0" y="155.5" text-anchor="middle">uploads monthly (keep 3);</text><text class="wf-text" x="121.0" y="170.5" text-anchor="middle">Enhance snapshots too</text></g>
<g class="wf-node wf-action" data-node="a2"><rect class="wf-act wf-act-external" x="245.0" y="215" width="180" height="59" rx="9"/><text class="wf-text" x="335.0" y="233.5" text-anchor="middle">Versioned bucket; the</text><text class="wf-text" x="335.0" y="248.5" text-anchor="middle">uploader can&#x27;t delete</text><text class="wf-text" x="335.0" y="263.5" text-anchor="middle">versions</text></g>
<g class="wf-node wf-end" data-node="ax"><circle class="wf-ring" cx="335.0" cy="337.5" r="13.0"/><circle class="wf-solid" cx="335.0" cy="337.5" r="8.0"/></g>
<g class="wf-node wf-start" data-node="b0"><circle class="wf-solid" cx="549.0" cy="77.0" r="11.0"/></g>
<g class="wf-node wf-action" data-node="b1"><rect class="wf-act wf-act-human" x="459.0" y="122" width="180" height="59" rx="9"/><text class="wf-text" x="549.0" y="140.5" text-anchor="middle">Monthly, by hand:</text><text class="wf-text" x="549.0" y="155.5" text-anchor="middle">backup-pull.sh from the</text><text class="wf-text" x="549.0" y="170.5" text-anchor="middle">Mac</text></g>
<g class="wf-node wf-action" data-node="b2"><rect class="wf-act wf-act-system" x="673.0" y="215" width="180" height="44" rx="9"/><text class="wf-text" x="763.0" y="233.5" text-anchor="middle">wp db export | gzip;</text><text class="wf-text" x="763.0" y="248.5" text-anchor="middle">rsync uploads</text></g>
<g class="wf-node wf-action" data-node="b3"><rect class="wf-act wf-act-human" x="459.0" y="308" width="180" height="59" rx="9"/><text class="wf-text" x="549.0" y="326.5" text-anchor="middle">Encrypted local folder;</text><text class="wf-text" x="549.0" y="341.5" text-anchor="middle">never pruned; uploads a</text><text class="wf-text" x="549.0" y="356.5" text-anchor="middle">single mirror</text></g>
<g class="wf-node wf-end" data-node="bx"><circle class="wf-ring" cx="549.0" cy="414.0" r="13.0"/><circle class="wf-solid" cx="549.0" cy="414.0" r="8.0"/></g>
<g class="wf-node wf-start" data-node="c0"><circle class="wf-solid" cx="549.0" cy="516.0" r="11.0"/></g>
<g class="wf-node wf-action" data-node="c1"><rect class="wf-act wf-act-human" x="459.0" y="561" width="180" height="59" rx="9"/><text class="wf-text" x="549.0" y="579.5" text-anchor="middle">Before each SSH content</text><text class="wf-text" x="549.0" y="594.5" text-anchor="middle">edit: wp db export</text><text class="wf-text" x="549.0" y="609.5" text-anchor="middle">~/backups/…</text></g>
<g class="wf-node wf-action" data-node="c2"><rect class="wf-act wf-act-system" x="673.0" y="654" width="180" height="59" rx="9"/><text class="wf-text" x="763.0" y="672.5" text-anchor="middle">Dumps stay on the host,</text><text class="wf-text" x="763.0" y="687.5" text-anchor="middle">never pruned (password</text><text class="wf-text" x="763.0" y="702.5" text-anchor="middle">hashes, 2FA secrets)</text><circle class="wf-pain" cx="849.0" cy="656" r="10.5"/><text class="wf-paintext" x="849.0" y="659.8" text-anchor="middle">O2</text></g>
<g class="wf-node wf-end" data-node="cx"><circle class="wf-ring" cx="763.0" cy="760.0" r="13.0"/><circle class="wf-solid" cx="763.0" cy="760.0" r="8.0"/></g>
<g class="wf-node wf-start" data-node="d0"><circle class="wf-solid" cx="549.0" cy="818.0" r="11.0"/></g>
<g class="wf-node wf-action" data-node="d1"><rect class="wf-act wf-act-human" x="459.0" y="863" width="180" height="44" rx="9"/><text class="wf-text" x="549.0" y="881.5" text-anchor="middle">Something broke: which</text><text class="wf-text" x="549.0" y="896.5" text-anchor="middle">copy, and how?</text></g>
<g class="wf-node wf-action" data-node="d2"><rect class="wf-act wf-act-human" x="459.0" y="941" width="180" height="74" rx="9"/><text class="wf-text" x="549.0" y="959.5" text-anchor="middle">No restore script or</text><text class="wf-text" x="549.0" y="974.5" text-anchor="middle">runbook steps; the</text><text class="wf-text" x="549.0" y="989.5" text-anchor="middle">twice-yearly drill has</text><text class="wf-text" x="549.0" y="1004.5" text-anchor="middle">not run</text><circle class="wf-pain" cx="635.0" cy="943" r="10.5"/><text class="wf-paintext" x="635.0" y="946.8" text-anchor="middle">O7</text></g>
<g class="wf-node wf-final" data-node="dx"><circle class="wf-ring wf-ringfill" cx="549.0" cy="1061.0" r="12.0"/><path class="wf-x" d="M540.6,1052.6 L557.4,1069.4 M540.6,1069.4 L557.4,1052.6"/><text class="wf-cap" x="549.0" y="1087.0" text-anchor="middle">Improvised under pressure</text></g>
</svg>
