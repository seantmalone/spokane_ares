<svg class="wf" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 884 1118" width="884" height="1118" role="img" aria-label="UML activity diagram: Back up and restore. Swimlanes: UpdraftPlus (on the host), AWS S3 bucket, Administrator (webmaster), Verpex host.">
