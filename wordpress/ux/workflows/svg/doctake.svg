<g class="wf-node wf-action" data-node="p2"><rect class="wf-act wf-act-system" x="459.0" y="1177" width="180" height="74" rx="9"/><text class="wf-text" x="549.0" y="1195.5" text-anchor="middle">Delete the file even if</text><text class="wf-text" x="549.0" y="1210.5" text-anchor="middle">pages link to it; source</text><text class="wf-text" x="549.0" y="1225.5" text-anchor="middle">Soon; draft; record who</text><text class="wf-text" x="549.0" y="1240.5" text-anchor="middle">and when</text><circle class="wf-pain" cx="635.0" cy="1179" r="10.5"/><text class="wf-paintext" x="635.0" y="1182.8" text-anchor="middle">D11</text></g>
