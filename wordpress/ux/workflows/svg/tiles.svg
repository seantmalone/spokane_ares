<g class="wf-node wf-action" data-node="open"><rect class="wf-act wf-act-human" x="31.0" y="122" width="180" height="34" rx="9"/><text class="wf-text" x="121.0" y="143.0" text-anchor="middle">Documents › Most Used</text></g>
<g class="wf-node wf-action" data-node="offer"><rect class="wf-act wf-act-system" x="245.0" y="190" width="180" height="59" rx="9"/><text class="wf-text" x="335.0" y="208.5" text-anchor="middle">Offer published, checked</text><text class="wf-text" x="335.0" y="223.5" text-anchor="middle">documents with a file or</text><text class="wf-text" x="335.0" y="238.5" text-anchor="middle">link</text></g>
<g class="wf-node wf-action" data-node="pick"><rect class="wf-act wf-act-human" x="31.0" y="283" width="180" height="59" rx="9"/><text class="wf-text" x="121.0" y="301.5" text-anchor="middle">Pick a document for each</text><text class="wf-text" x="121.0" y="316.5" text-anchor="middle">of 4 buttons; optional</text><text class="wf-text" x="121.0" y="331.5" text-anchor="middle">button words; Save</text></g>
<g class="wf-node wf-decision" data-node="dup"><path class="wf-dec" d="M335.0,376 L431.0,404.0 L335.0,432 L239.0,404.0 z"/><text class="wf-text" x="335.0" y="400.5" text-anchor="middle">Already on another</text><text class="wf-text" x="335.0" y="415.5" text-anchor="middle">button?</text></g>
<g class="wf-node wf-action" data-node="swap"><rect class="wf-act wf-act-system" x="245.0" y="466" width="180" height="34" rx="9"/><text class="wf-text" x="335.0" y="487.0" text-anchor="middle">Swap the two buttons</text></g>
<g class="wf-node wf-action" data-node="clear"><rect class="wf-act wf-act-system" x="459.0" y="466" width="180" height="44" rx="9"/><text class="wf-text" x="549.0" y="484.5" text-anchor="middle">A new document clears the</text><text class="wf-text" x="549.0" y="499.5" text-anchor="middle">old words</text></g>
<g class="wf-node wf-merge" data-node="m"><path class="wf-dec" d="M335.0,544.0 L346.0,555.0 L335.0,566.0 L324.0,555.0 z"/></g>
<g class="wf-node wf-action" data-node="save"><rect class="wf-act wf-act-system" x="245.0" y="600" width="180" height="44" rx="9"/><text class="wf-text" x="335.0" y="618.5" text-anchor="middle">Check words; save;</text><text class="wf-text" x="335.0" y="633.5" text-anchor="middle">&#x27;Saved.&#x27;</text></g>
<g class="wf-node wf-action" data-node="site"><rect class="wf-act wf-act-external" x="673.0" y="678" width="180" height="59" rx="9"/><text class="wf-text" x="763.0" y="696.5" text-anchor="middle">Four buttons on For</text><text class="wf-text" x="763.0" y="711.5" text-anchor="middle">members; their documents</text><text class="wf-text" x="763.0" y="726.5" text-anchor="middle">join the Most used filter</text></g>
<g class="wf-node wf-action" data-node="later"><rect class="wf-act wf-act-system" x="245.0" y="771" width="180" height="74" rx="9"/><text class="wf-text" x="335.0" y="789.5" text-anchor="middle">Later: a button&#x27;s</text><text class="wf-text" x="335.0" y="804.5" text-anchor="middle">document goes to draft →</text><text class="wf-text" x="335.0" y="819.5" text-anchor="middle">its button vanishes from</text><text class="wf-text" x="335.0" y="834.5" text-anchor="middle">the site, no warning</text><circle class="wf-pain" cx="421.0" cy="773" r="10.5"/><text class="wf-paintext" x="421.0" y="776.8" text-anchor="middle">D12</text></g>
<g class="wf-node wf-end" data-node="x"><circle class="wf-ring" cx="335.0" cy="892.0" r="13.0"/><circle class="wf-solid" cx="335.0" cy="892.0" r="8.0"/></g>
<rect class="wf-guardbg" x="338.0" y="435.0" width="34.0" height="13" rx="2"/>
<text class="wf-guard" x="340.0" y="445.0" text-anchor="start">[yes]</text>
<rect class="wf-guardbg" x="435.0" y="389.0" width="28.0" height="13" rx="2"/>
<text class="wf-guard" x="437.0" y="399.0" text-anchor="start">[no]</text>
