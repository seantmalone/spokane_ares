<g class="wf-node wf-action" data-node="open"><rect class="wf-act wf-act-human" x="31.0" y="122" width="180" height="59" rx="9"/><text class="wf-text" x="121.0" y="140.5" text-anchor="middle">Dashboard › Page Text ›</text><text class="wf-text" x="121.0" y="155.5" text-anchor="middle">page, or &#x27;Edit Page Text&#x27;</text><text class="wf-text" x="121.0" y="170.5" text-anchor="middle">on the site</text></g>
<g class="wf-node wf-action" data-node="lock"><rect class="wf-act wf-act-system" x="245.0" y="215" width="180" height="74" rx="9"/><text class="wf-text" x="335.0" y="233.5" text-anchor="middle">Locked editor: words</text><text class="wf-text" x="335.0" y="248.5" text-anchor="middle">only; list items can be</text><text class="wf-text" x="335.0" y="263.5" text-anchor="middle">added; multi-paragraph</text><text class="wf-text" x="335.0" y="278.5" text-anchor="middle">paste collapsed</text></g>
<g class="wf-node wf-action" data-node="edit"><rect class="wf-act wf-act-human" x="31.0" y="323" width="180" height="74" rx="9"/><text class="wf-text" x="121.0" y="341.5" text-anchor="middle">Edit headings,</text><text class="wf-text" x="121.0" y="356.5" text-anchor="middle">paragraphs, list items,</text><text class="wf-text" x="121.0" y="371.5" text-anchor="middle">buttons, table cells, the</text><text class="wf-text" x="121.0" y="386.5" text-anchor="middle">Home photo</text></g>
<g class="wf-node wf-action" data-node="save"><rect class="wf-act wf-act-human" x="31.0" y="431" width="180" height="34" rx="9"/><text class="wf-text" x="121.0" y="452.0" text-anchor="middle">Click Save</text></g>
<g class="wf-node wf-action" data-node="cmp"><rect class="wf-act wf-act-system" x="459.0" y="499" width="180" height="74" rx="9"/><text class="wf-text" x="549.0" y="517.5" text-anchor="middle">Compare block skeleton</text><text class="wf-text" x="549.0" y="532.5" text-anchor="middle">with the stored page;</text><text class="wf-text" x="549.0" y="547.5" text-anchor="middle">buttons need words and</text><text class="wf-text" x="549.0" y="562.5" text-anchor="middle">links; hero needs a photo</text></g>
<g class="wf-node wf-decision" data-node="bad"><path class="wf-dec" d="M549.0,607 L645.0,642.5 L549.0,678 L453.0,642.5 z"/><text class="wf-text" x="549.0" y="631.5" text-anchor="middle">Layout changed, or</text><text class="wf-text" x="549.0" y="646.5" text-anchor="middle">button/photo</text><text class="wf-text" x="549.0" y="661.5" text-anchor="middle">missing?</text></g>
<g class="wf-node wf-action" data-node="refuse"><rect class="wf-act wf-act-system" x="673.0" y="712" width="180" height="44" rx="9"/><text class="wf-text" x="763.0" y="730.5" text-anchor="middle">403 &#x27;Not saved: …&#x27;</text><text class="wf-text" x="763.0" y="745.5" text-anchor="middle">(nothing changes)</text></g>
<g class="wf-node wf-action" data-node="ok"><rect class="wf-act wf-act-system" x="459.0" y="712" width="180" height="44" rx="9"/><text class="wf-text" x="549.0" y="730.5" text-anchor="middle">Save; &#x27;Saved. It&#x27;s on the</text><text class="wf-text" x="549.0" y="745.5" text-anchor="middle">site now.&#x27;</text></g>
<g class="wf-node wf-action" data-node="scan"><rect class="wf-act wf-act-system" x="245.0" y="790" width="180" height="74" rx="9"/><text class="wf-text" x="335.0" y="808.5" text-anchor="middle">After saving: scan for</text><text class="wf-text" x="335.0" y="823.5" text-anchor="middle">never-publish words,</text><text class="wf-text" x="335.0" y="838.5" text-anchor="middle">phones, e-mails, missing</text><text class="wf-text" x="335.0" y="853.5" text-anchor="middle">bold, http links</text></g>
<g class="wf-node wf-decision" data-node="hit"><path class="wf-dec" d="M335.0,898 L431.0,920.0 L335.0,942 L239.0,920.0 z"/><text class="wf-text" x="335.0" y="924.0" text-anchor="middle">Anything found?</text></g>
<g class="wf-node wf-action" data-node="warn"><rect class="wf-act wf-act-system" x="245.0" y="976" width="180" height="74" rx="9"/><text class="wf-text" x="335.0" y="994.5" text-anchor="middle">Yellow &#x27;On the site now:</text><text class="wf-text" x="335.0" y="1009.5" text-anchor="middle">…&#x27;; Dashboard Needs</text><text class="wf-text" x="335.0" y="1024.5" text-anchor="middle">attention (still</text><text class="wf-text" x="335.0" y="1039.5" text-anchor="middle">published)</text><circle class="wf-pain" cx="421.0" cy="978" r="10.5"/><text class="wf-paintext" x="421.0" y="981.8" text-anchor="middle">P1</text></g>
