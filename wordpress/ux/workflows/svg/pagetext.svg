<g class="wf-node wf-end" data-node="x"><circle class="wf-ring" cx="977.0" cy="1221.0" r="13.0"/><circle class="wf-solid" cx="977.0" cy="1221.0" r="8.0"/></g>
<g class="wf-node wf-action" data-node="ask"><rect class="wf-act wf-act-human" x="31.0" y="1368" width="180" height="74" rx="9"/><text class="wf-text" x="121.0" y="1386.5" text-anchor="middle">Needs a new section,</text><text class="wf-text" x="121.0" y="1401.5" text-anchor="middle">table row, page, or an</text><text class="wf-text" x="121.0" y="1416.5" text-anchor="middle">older version: e-mail the</text><text class="wf-text" x="121.0" y="1431.5" text-anchor="middle">webmaster</text><circle class="wf-pain" cx="207.0" cy="1370" r="10.5"/><text class="wf-paintext" x="207.0" y="1373.8" text-anchor="middle">P2</text></g>
<g class="wf-node wf-action" data-node="blk"><rect class="wf-act wf-act-human" x="1101.0" y="1476" width="180" height="44" rx="9"/><text class="wf-text" x="1191.0" y="1494.5" text-anchor="middle">Edit in the block editor</text><text class="wf-text" x="1191.0" y="1509.5" text-anchor="middle">(the lock doesn&#x27;t apply)</text></g>
<g class="wf-node wf-action" data-node="git"><rect class="wf-act wf-act-human" x="1101.0" y="1554" width="180" height="74" rx="9"/><text class="wf-text" x="1191.0" y="1572.5" text-anchor="middle">Copy the section by hand</text><text class="wf-text" x="1191.0" y="1587.5" text-anchor="middle">into</text><text class="wf-text" x="1191.0" y="1602.5" text-anchor="middle">theme/spokares/patterns/*.php</text><text class="wf-text" x="1191.0" y="1617.5" text-anchor="middle">for the next release</text><circle class="wf-pain" cx="1277.0" cy="1556" r="10.5"/><text class="wf-paintext" x="1277.0" y="1559.8" text-anchor="middle">P3</text></g>
