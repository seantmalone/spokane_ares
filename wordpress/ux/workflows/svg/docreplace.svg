<g class="wf-node wf-action" data-node="note"><rect class="wf-act wf-act-system" x="459.0" y="1000" width="180" height="74" rx="9"/><text class="wf-text" x="549.0" y="1018.5" text-anchor="middle">Notice &#x27;Saved. The new</text><text class="wf-text" x="549.0" y="1033.5" text-anchor="middle">file is on the site and</text><text class="wf-text" x="549.0" y="1048.5" text-anchor="middle">the old one is off the</text><text class="wf-text" x="549.0" y="1063.5" text-anchor="middle">web.&#x27;</text></g>
<g class="wf-node wf-action" data-node="site"><rect class="wf-act wf-act-external" x="887.0" y="1108" width="180" height="44" rx="9"/><text class="wf-text" x="977.0" y="1126.5" text-anchor="middle">/docs/&lt;slug&gt;/ now serves</text><text class="wf-text" x="977.0" y="1141.5" text-anchor="middle">the new file</text></g>
