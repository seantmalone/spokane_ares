<g class="wf-node wf-action" data-node="keep"><rect class="wf-act wf-act-system" x="673.0" y="683" width="180" height="59" rx="9"/><text class="wf-text" x="763.0" y="701.5" text-anchor="middle">Current source stays</text><text class="wf-text" x="763.0" y="716.5" text-anchor="middle">live; &#x27;Saved, except the</text><text class="wf-text" x="763.0" y="731.5" text-anchor="middle">new file&#x27;</text></g>
<g class="wf-node wf-decision" data-node="used"><path class="wf-dec" d="M549.0,683 L645.0,718.5 L549.0,754 L453.0,718.5 z"/><text class="wf-text" x="549.0" y="707.5" text-anchor="middle">Old file used by</text><text class="wf-text" x="549.0" y="722.5" text-anchor="middle">another document or</text><text class="wf-text" x="549.0" y="737.5" text-anchor="middle">page?</text></g>
<g class="wf-node wf-action" data-node="stay"><rect class="wf-act wf-act-system" x="673.0" y="788" width="180" height="44" rx="9"/><text class="wf-text" x="763.0" y="806.5" text-anchor="middle">Keep the old file; notice</text><text class="wf-text" x="763.0" y="821.5" text-anchor="middle">names who uses it</text></g>
<g class="wf-node wf-action" data-node="del"><rect class="wf-act wf-act-system" x="459.0" y="788" width="180" height="44" rx="9"/><text class="wf-text" x="549.0" y="806.5" text-anchor="middle">Delete the old file (an</text><text class="wf-text" x="549.0" y="821.5" text-anchor="middle">admin may untick this)</text></g>
<g class="wf-node wf-merge" data-node="m1"><path class="wf-dec" d="M549.0,866.0 L560.0,877.0 L549.0,888.0 L538.0,877.0 z"/></g>
