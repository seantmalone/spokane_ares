<g class="wf-node wf-action" data-node="sw"><rect class="wf-act wf-act-human" x="245.0" y="293" width="180" height="74" rx="9"/><text class="wf-text" x="335.0" y="311.5" text-anchor="middle">Pick Link, Upload instead</text><text class="wf-text" x="335.0" y="326.5" text-anchor="middle">or Soon; fresh tick (the</text><text class="wf-text" x="335.0" y="341.5" text-anchor="middle">script unticks both</text><text class="wf-text" x="335.0" y="356.5" text-anchor="middle">boxes)</text></g>
