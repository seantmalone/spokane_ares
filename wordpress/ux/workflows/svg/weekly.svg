<g class="wf-node wf-action" data-node="mail"><rect class="wf-act wf-act-system" x="245.0" y="446" width="180" height="74" rx="9"/><text class="wf-text" x="335.0" y="464.5" text-anchor="middle">wp_mail to</text><text class="wf-text" x="335.0" y="479.5" text-anchor="middle">webmaster@spokares.org</text><text class="wf-text" x="335.0" y="494.5" text-anchor="middle">(address and SMTP not</text><text class="wf-text" x="335.0" y="509.5" text-anchor="middle">verified)</text><circle class="wf-pain" cx="421.0" cy="448" r="10.5"/><text class="wf-paintext" x="421.0" y="451.8" text-anchor="middle">O6</text></g>
