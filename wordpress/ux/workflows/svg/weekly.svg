<g class="wf-node wf-action" data-node="chk"><rect class="wf-act wf-act-system" x="245.0" y="215" width="180" height="119" rx="9"/><text class="wf-text" x="335.0" y="233.5" text-anchor="middle">PHP in uploads,</text><text class="wf-text" x="335.0" y="248.5" text-anchor="middle">plugin/theme list,</text><text class="wf-text" x="335.0" y="263.5" text-anchor="middle">checksums, Two-Factor on,</text><text class="wf-text" x="335.0" y="278.5" text-anchor="middle">admin list, 2FA for</text><text class="wf-text" x="335.0" y="293.5" text-anchor="middle">edit_posts users,</text><text class="wf-text" x="335.0" y="308.5" text-anchor="middle">constants, Site Editor</text><text class="wf-text" x="335.0" y="323.5" text-anchor="middle">overrides</text></g>
<g class="wf-node wf-decision" data-node="ok"><path class="wf-dec" d="M335.0,368 L431.0,390.0 L335.0,412 L239.0,390.0 z"/><text class="wf-text" x="335.0" y="394.0" text-anchor="middle">All clear?</text></g>
