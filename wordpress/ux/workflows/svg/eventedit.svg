<g class="wf-node wf-action" data-node="add"><rect class="wf-act wf-act-human" x="31.0" y="122" width="180" height="59" rx="9"/><text class="wf-text" x="121.0" y="140.5" text-anchor="middle">Dashboard › Add an event</text><text class="wf-text" x="121.0" y="155.5" text-anchor="middle">(form opens on a new</text><text class="wf-text" x="121.0" y="170.5" text-anchor="middle">draft)</text></g>
<g class="wf-node wf-action" data-node="type"><rect class="wf-act wf-act-human" x="31.0" y="215" width="180" height="44" rx="9"/><text class="wf-text" x="121.0" y="233.5" text-anchor="middle">Pick Type of event (no</text><text class="wf-text" x="121.0" y="248.5" text-anchor="middle">default); type the name</text></g>
<g class="wf-node wf-decision" data-node="dupe"><path class="wf-dec" d="M335.0,293 L431.0,321.0 L335.0,349 L239.0,321.0 z"/><text class="wf-text" x="335.0" y="317.5" text-anchor="middle">Name matches an</text><text class="wf-text" x="335.0" y="332.5" text-anchor="middle">existing event?</text></g>
<g class="wf-node wf-start" data-node="s2"><circle class="wf-solid" cx="121.0" cy="321.0" r="11.0"/></g>
<g class="wf-node wf-action" data-node="pick"><rect class="wf-act wf-act-human" x="31.0" y="383" width="180" height="59" rx="9"/><text class="wf-text" x="121.0" y="401.5" text-anchor="middle">Dashboard › Change or</text><text class="wf-text" x="121.0" y="416.5" text-anchor="middle">cancel → Upcoming list →</text><text class="wf-text" x="121.0" y="431.5" text-anchor="middle">open the event</text><circle class="wf-pain" cx="207.0" cy="385" r="10.5"/><text class="wf-paintext" x="207.0" y="388.8" text-anchor="middle">E7</text></g>
<g class="wf-node wf-action" data-node="form"><rect class="wf-act wf-act-human" x="31.0" y="476" width="180" height="59" rx="9"/><text class="wf-text" x="121.0" y="494.5" text-anchor="middle">Event form opens with</text><text class="wf-text" x="121.0" y="509.5" text-anchor="middle">current problems and any</text><text class="wf-text" x="121.0" y="524.5" text-anchor="middle">held typing</text></g>
<g class="wf-node wf-action" data-node="when"><rect class="wf-act wf-act-human" x="31.0" y="569" width="180" height="89" rx="9"/><text class="wf-text" x="121.0" y="587.5" text-anchor="middle">When: On a date (days;</text><text class="wf-text" x="121.0" y="602.5" text-anchor="middle">All day or start/end</text><text class="wf-text" x="121.0" y="617.5" text-anchor="middle">times), Postponed, Date</text><text class="wf-text" x="121.0" y="632.5" text-anchor="middle">not posted yet, As</text><text class="wf-text" x="121.0" y="647.5" text-anchor="middle">requested</text></g>
<g class="wf-node wf-action" data-node="fields"><rect class="wf-act wf-act-human" x="31.0" y="692" width="180" height="89" rx="9"/><text class="wf-text" x="121.0" y="710.5" text-anchor="middle">Fill the boxes the type</text><text class="wf-text" x="121.0" y="725.5" text-anchor="middle">shows: Where, short line,</text><text class="wf-text" x="121.0" y="740.5" text-anchor="middle">tasks, button, links,</text><text class="wf-text" x="121.0" y="755.5" text-anchor="middle">document, volunteer</text><text class="wf-text" x="121.0" y="770.5" text-anchor="middle">contact</text><circle class="wf-pain" cx="207.0" cy="694" r="10.5"/><text class="wf-paintext" x="207.0" y="697.8" text-anchor="middle">E5</text></g>
<g class="wf-node wf-decision" data-node="btn"><path class="wf-dec" d="M121.0,815 L217.0,837.0 L121.0,859 L25.0,837.0 z"/><text class="wf-text" x="121.0" y="841.0" text-anchor="middle">Which button?</text></g>
<g class="wf-node wf-action" data-node="check"><rect class="wf-act wf-act-system" x="459.0" y="893" width="180" height="74" rx="9"/><text class="wf-text" x="549.0" y="911.5" text-anchor="middle">Check type, name, dates,</text><text class="wf-text" x="549.0" y="926.5" text-anchor="middle">times (end after start,</text><text class="wf-text" x="549.0" y="941.5" text-anchor="middle">ignoring Last day),</text><text class="wf-text" x="549.0" y="956.5" text-anchor="middle">lengths, links, words</text><circle class="wf-pain" cx="635.0" cy="895" r="10.5"/><text class="wf-paintext" x="635.0" y="898.8" text-anchor="middle">E1</text></g>
<g class="wf-node wf-action" data-node="draft"><rect class="wf-act wf-act-system" x="673.0" y="893" width="180" height="59" rx="9"/><text class="wf-text" x="763.0" y="911.5" text-anchor="middle">Save draft: everything</text><text class="wf-text" x="763.0" y="926.5" text-anchor="middle">saved; notice says only</text><text class="wf-text" x="763.0" y="941.5" text-anchor="middle">&#x27;Draft saved&#x27;</text><circle class="wf-pain" cx="849.0" cy="895" r="10.5"/><text class="wf-paintext" x="849.0" y="898.8" text-anchor="middle">E6</text></g>
<g class="wf-node wf-final" data-node="fd"><circle class="wf-ring wf-ringfill" cx="763.0" cy="1036.5" r="12.0"/><path class="wf-x" d="M754.6,1028.1 L771.4,1044.9 M754.6,1044.9 L771.4,1028.1"/><text class="wf-cap" x="763.0" y="1062.5" text-anchor="middle">Draft, not on the site</text></g>
<g class="wf-node wf-decision" data-node="prob"><path class="wf-dec" d="M549.0,1001 L645.0,1036.5 L549.0,1072 L453.0,1036.5 z"/><text class="wf-text" x="549.0" y="1025.5" text-anchor="middle">Problem or</text><text class="wf-text" x="549.0" y="1040.5" text-anchor="middle">unconfirmed</text><text class="wf-text" x="549.0" y="1055.5" text-anchor="middle">phone/e-mail?</text></g>
<g class="wf-node wf-action" data-node="pub"><rect class="wf-act wf-act-system" x="459.0" y="1106" width="180" height="44" rx="9"/><text class="wf-text" x="549.0" y="1124.5" text-anchor="middle">Publish; recompute sort</text><text class="wf-text" x="549.0" y="1139.5" text-anchor="middle">keys</text></g>
<g class="wf-node wf-action" data-node="hold"><rect class="wf-act wf-act-system" x="673.0" y="1106" width="180" height="104" rx="9"/><text class="wf-text" x="763.0" y="1124.5" text-anchor="middle">New event: forced to</text><text class="wf-text" x="763.0" y="1139.5" text-anchor="middle">draft. Published: rest</text><text class="wf-text" x="763.0" y="1154.5" text-anchor="middle">saved, problem fields</text><text class="wf-text" x="763.0" y="1169.5" text-anchor="middle">keep live values, typing</text><text class="wf-text" x="763.0" y="1184.5" text-anchor="middle">held 7 days (&#x27;Saved,</text><text class="wf-text" x="763.0" y="1199.5" text-anchor="middle">except…&#x27;)</text></g>
<g class="wf-node wf-action" data-node="where"><rect class="wf-act wf-act-system" x="459.0" y="1244" width="180" height="74" rx="9"/><text class="wf-text" x="549.0" y="1262.5" text-anchor="middle">Work out the lists it</text><text class="wf-text" x="549.0" y="1277.5" text-anchor="middle">lands in; notice</text><text class="wf-text" x="549.0" y="1292.5" text-anchor="middle">&#x27;Published. It shows</text><text class="wf-text" x="549.0" y="1307.5" text-anchor="middle">under Next up…&#x27;</text></g>
<g class="wf-node wf-decision" data-node="past"><path class="wf-dec" d="M549.0,1352 L645.0,1374.0 L549.0,1396 L453.0,1374.0 z"/><text class="wf-text" x="549.0" y="1378.0" text-anchor="middle">Date already passed?</text></g>
<g class="wf-node wf-action" data-node="amber"><rect class="wf-act wf-act-system" x="673.0" y="1430" width="180" height="59" rx="9"/><text class="wf-text" x="763.0" y="1448.5" text-anchor="middle">Amber: &#x27;has passed… Check</text><text class="wf-text" x="763.0" y="1463.5" text-anchor="middle">the year&#x27; (already live,</text><text class="wf-text" x="763.0" y="1478.5" text-anchor="middle">listed nowhere)</text><circle class="wf-pain" cx="849.0" cy="1432" r="10.5"/><text class="wf-paintext" x="849.0" y="1435.8" text-anchor="middle">E2</text></g>
<g class="wf-node wf-merge" data-node="m2"><path class="wf-dec" d="M549.0,1523.0 L560.0,1534.0 L549.0,1545.0 L538.0,1534.0 z"/></g>
