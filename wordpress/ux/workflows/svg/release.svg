<svg class="wf" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 884 1240" width="884" height="1240" role="img" aria-label="UML activity diagram: Release and deploy a new version. Swimlanes: Developer (webmaster), GitHub Actions, Approver (same person), Verpex host.">
<style>.wf-bg{fill:#fbfaf7}.wf-lane{stroke:#c9ccd1;stroke-width:1}.wf-lane-human{fill:#ffffff}.wf-lane-system{fill:#f3f1ec}.wf-lane-external{fill:#f7f2f6}.wf-lanehead{stroke:#c9ccd1}.wf-lanehead-human{fill:#e7edf6}.wf-lanehead-system{fill:#e9e4d8}.wf-lanehead-external{fill:#ece0ea}.wf-lanelabel{fill:#1e2328;font:600 12.5px system-ui,-apple-system,sans-serif;letter-spacing:.02em}.wf-act{stroke:#1e2328;stroke-width:1.2}.wf-act-human{fill:#ffffff}.wf-act-system{fill:#fffdf8}.wf-act-external{fill:#fffafe}.wf-dec{fill:#ffffff;stroke:#1e2328;stroke-width:1.2}.wf-solid{fill:#1e2328}.wf-ring{fill:none;stroke:#1e2328;stroke-width:1.4}.wf-ringfill{fill:#fbfaf7}.wf-x{stroke:#1e2328;stroke-width:1.4}.wf-text{fill:#1e2328;font:12px system-ui,-apple-system,sans-serif}.wf-cap{fill:#5d6670;font:italic 11.5px system-ui,-apple-system,sans-serif}.wf-edge{fill:none;stroke:#1e2328;stroke-width:1.2}.wf-edge-back{stroke-dasharray:5 3}.wf-arrowhead{fill:#1e2328}.wf-guardbg{fill:#fbfaf7;opacity:.92}.wf-guard{fill:#5d6670;font:11px ui-monospace,SFMono-Regular,Menlo,monospace}.wf-pain{fill:#c2410c}.wf-paintext{fill:#ffffff;font:700 10.5px system-ui,-apple-system,sans-serif}@media (prefers-color-scheme: dark){.wf-bg{fill:#15181c}.wf-lane{stroke:#3a4048;stroke-width:1}.wf-lane-human{fill:#1b1f24}.wf-lane-system{fill:#1d1c19}.wf-lane-external{fill:#1f1a1f}.wf-lanehead{stroke:#3a4048}.wf-lanehead-human{fill:#243246}.wf-lanehead-system{fill:#33302a}.wf-lanehead-external{fill:#3a2c38}.wf-lanelabel{fill:#e6e8eb;font:600 12.5px system-ui,-apple-system,sans-serif;letter-spacing:.02em}.wf-act{stroke:#e6e8eb;stroke-width:1.2}.wf-act-human{fill:#20252b}.wf-act-system{fill:#25231f}.wf-act-external{fill:#271f27}.wf-dec{fill:#20252b;stroke:#e6e8eb;stroke-width:1.2}.wf-solid{fill:#e6e8eb}.wf-ring{fill:none;stroke:#e6e8eb;stroke-width:1.4}.wf-ringfill{fill:#15181c}.wf-x{stroke:#e6e8eb;stroke-width:1.4}.wf-text{fill:#e6e8eb;font:12px system-ui,-apple-system,sans-serif}.wf-cap{fill:#9aa3ad;font:italic 11.5px system-ui,-apple-system,sans-serif}.wf-edge{fill:none;stroke:#e6e8eb;stroke-width:1.2}.wf-edge-back{stroke-dasharray:5 3}.wf-arrowhead{fill:#e6e8eb}.wf-guardbg{fill:#15181c;opacity:.92}.wf-guard{fill:#9aa3ad;font:11px ui-monospace,SFMono-Regular,Menlo,monospace}.wf-pain{fill:#fb923c}.wf-paintext{fill:#1a1208;font:700 10.5px system-ui,-apple-system,sans-serif}}</style>
<rect class="wf-bg" x="0" y="0" width="884" height="1240"/>
<defs><marker id="arr-release" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wf-arrowhead" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="wf-lane wf-lane-human" x="14" y="7.0" width="214" height="1226"/>
<rect class="wf-lanehead wf-lanehead-human" x="14" y="7.0" width="214" height="37.0"/>
<text class="wf-lanelabel" x="121.0" y="30.0" text-anchor="middle">Developer (webmaster)</text>
<rect class="wf-lane wf-lane-system" x="228" y="7.0" width="214" height="1226"/>
<rect class="wf-lanehead wf-lanehead-system" x="228" y="7.0" width="214" height="37.0"/>
<text class="wf-lanelabel" x="335.0" y="30.0" text-anchor="middle">GitHub Actions</text>
<rect class="wf-lane wf-lane-human" x="442" y="7.0" width="214" height="1226"/>
<rect class="wf-lanehead wf-lanehead-human" x="442" y="7.0" width="214" height="37.0"/>
<text class="wf-lanelabel" x="549.0" y="30.0" text-anchor="middle">Approver (same person)</text>
<rect class="wf-lane wf-lane-system" x="656" y="7.0" width="214" height="1226"/>
<rect class="wf-lanehead wf-lanehead-system" x="656" y="7.0" width="214" height="37.0"/>
<text class="wf-lanelabel" x="763.0" y="30.0" text-anchor="middle">Verpex host</text>
<path class="wf-edge" d="M121.0,88.0 L121.0,122.0" marker-end="url(#arr-release)"/>
<path class="wf-edge" d="M121.0,166.0 L121.0,200.0" marker-end="url(#arr-release)"/>
<path class="wf-edge" d="M121.0,234.0 L121.0,251.0 L335.0,251.0 L335.0,268.0" marker-end="url(#arr-release)"/>
<path class="wf-edge" d="M335.0,312.0 L335.0,346.0" marker-end="url(#arr-release)"/>
<path class="wf-edge" d="M239.0,368.0 L121.0,368.0 L121.0,424.0" marker-end="url(#arr-release)"/>
<path class="wf-edge wf-edge-back" d="M431.0,368.0 L436.0,368.0 L436.0,144.0 L211.0,144.0" marker-end="url(#arr-release)"/>
<path class="wf-edge" d="M121.0,458.0 L121.0,475.0 L335.0,475.0 L335.0,492.0" marker-end="url(#arr-release)"/>
<path class="wf-edge" d="M335.0,566.0 L335.0,600.0" marker-end="url(#arr-release)"/>
<path class="wf-edge" d="M335.0,644.0 L335.0,661.0 L549.0,661.0 L549.0,678.0" marker-end="url(#arr-release)"/>
<path class="wf-edge" d="M549.0,722.0 L549.0,739.0 L335.0,739.0 L335.0,756.0" marker-end="url(#arr-release)"/>
<path class="wf-edge" d="M335.0,815.0 L335.0,832.0 L763.0,832.0 L763.0,849.0" marker-end="url(#arr-release)"/>
<path class="wf-edge" d="M763.0,938.0 L763.0,955.0 L335.0,955.0 L335.0,972.0" marker-end="url(#arr-release)"/>
<path class="wf-edge" d="M335.0,1031.0 L335.0,1048.0 L121.0,1048.0 L121.0,1065.0" marker-end="url(#arr-release)"/>
<path class="wf-edge" d="M121.0,1154.0 L121.0,1188.0" marker-end="url(#arr-release)"/>
<g class="wf-node wf-start" data-node="s"><circle class="wf-solid" cx="121.0" cy="77.0" r="11.0"/></g>
<g class="wf-node wf-action" data-node="bump"><rect class="wf-act wf-act-human" x="31.0" y="122" width="180" height="44" rx="9"/><text class="wf-text" x="121.0" y="140.5" text-anchor="middle">Bump the version by hand</text><text class="wf-text" x="121.0" y="155.5" text-anchor="middle">in 8 places</text><circle class="wf-pain" cx="207.0" cy="124" r="10.5"/><text class="wf-paintext" x="207.0" y="127.8" text-anchor="middle">O3</text></g>
<g class="wf-node wf-action" data-node="push"><rect class="wf-act wf-act-human" x="31.0" y="200" width="180" height="34" rx="9"/><text class="wf-text" x="121.0" y="221.0" text-anchor="middle">Push to main</text></g>
<g class="wf-node wf-action" data-node="ci"><rect class="wf-act wf-act-system" x="245.0" y="268" width="180" height="44" rx="9"/><text class="wf-text" x="335.0" y="286.5" text-anchor="middle">ci.yml: lint, version</text><text class="wf-text" x="335.0" y="301.5" text-anchor="middle">match, tests</text></g>
<g class="wf-node wf-decision" data-node="green"><path class="wf-dec" d="M335.0,346 L431.0,368.0 L335.0,390 L239.0,368.0 z"/><text class="wf-text" x="335.0" y="372.0" text-anchor="middle">CI green?</text></g>
<g class="wf-node wf-action" data-node="tag"><rect class="wf-act wf-act-human" x="31.0" y="424" width="180" height="34" rx="9"/><text class="wf-text" x="121.0" y="445.0" text-anchor="middle">Tag v* and push</text></g>
<g class="wf-node wf-action" data-node="ref"><rect class="wf-act wf-act-system" x="245.0" y="492" width="180" height="74" rx="9"/><text class="wf-text" x="335.0" y="510.5" text-anchor="middle">check-ref: main or v*</text><text class="wf-text" x="335.0" y="525.5" text-anchor="middle">only; CI again on the</text><text class="wf-text" x="335.0" y="540.5" text-anchor="middle">exact commit; tag =</text><text class="wf-text" x="335.0" y="555.5" text-anchor="middle">version</text></g>
<g class="wf-node wf-action" data-node="wait"><rect class="wf-act wf-act-system" x="245.0" y="600" width="180" height="44" rx="9"/><text class="wf-text" x="335.0" y="618.5" text-anchor="middle">Wait for the production</text><text class="wf-text" x="335.0" y="633.5" text-anchor="middle">environment&#x27;s approval</text></g>
<g class="wf-node wf-action" data-node="ok"><rect class="wf-act wf-act-human" x="459.0" y="678" width="180" height="44" rx="9"/><text class="wf-text" x="549.0" y="696.5" text-anchor="middle">Review deployments ›</text><text class="wf-text" x="549.0" y="711.5" text-anchor="middle">Approve</text><circle class="wf-pain" cx="635.0" cy="680" r="10.5"/><text class="wf-paintext" x="635.0" y="683.8" text-anchor="middle">O4</text></g>
<g class="wf-node wf-action" data-node="rs"><rect class="wf-act wf-act-system" x="245.0" y="756" width="180" height="59" rx="9"/><text class="wf-text" x="335.0" y="774.5" text-anchor="middle">deploy.sh: rsync theme,</text><text class="wf-text" x="335.0" y="789.5" text-anchor="middle">plugin, mu-plugin and</text><text class="wf-text" x="335.0" y="804.5" text-anchor="middle">weekly-check.sh</text></g>
<g class="wf-node wf-action" data-node="post"><rect class="wf-act wf-act-system" x="673.0" y="849" width="180" height="89" rx="9"/><text class="wf-text" x="763.0" y="867.5" text-anchor="middle">post-deploy.sh: perms;</text><text class="wf-text" x="763.0" y="882.5" text-anchor="middle">install Two-Factor +</text><text class="wf-text" x="763.0" y="897.5" text-anchor="middle">UpdraftPlus unpinned,</text><text class="wf-text" x="763.0" y="912.5" text-anchor="middle">auto-updates on;</text><text class="wf-text" x="763.0" y="927.5" text-anchor="middle">activate; flush</text><circle class="wf-pain" cx="849.0" cy="851" r="10.5"/><text class="wf-paintext" x="849.0" y="854.8" text-anchor="middle">O5</text></g>
<g class="wf-node wf-action" data-node="live"><rect class="wf-act wf-act-system" x="245.0" y="972" width="180" height="59" rx="9"/><text class="wf-text" x="335.0" y="990.5" text-anchor="middle">check-live.sh: rsync</text><text class="wf-text" x="335.0" y="1005.5" text-anchor="middle">dry-run, file checks,</text><text class="wf-text" x="335.0" y="1020.5" text-anchor="middle">headers, 404/410</text></g>
<g class="wf-node wf-action" data-node="hand"><rect class="wf-act wf-act-human" x="31.0" y="1065" width="180" height="89" rx="9"/><text class="wf-text" x="121.0" y="1083.5" text-anchor="middle">By hand: gh release</text><text class="wf-text" x="121.0" y="1098.5" text-anchor="middle">create with zips; one-off</text><text class="wf-text" x="121.0" y="1113.5" text-anchor="middle">wp commands for renamed</text><text class="wf-text" x="121.0" y="1128.5" text-anchor="middle">content; restart PHP if</text><text class="wf-text" x="121.0" y="1143.5" text-anchor="middle">OPcache is stale</text><circle class="wf-pain" cx="207.0" cy="1067" r="10.5"/><text class="wf-paintext" x="207.0" y="1070.8" text-anchor="middle">O3</text></g>
<g class="wf-node wf-end" data-node="x"><circle class="wf-ring" cx="121.0" cy="1201.0" r="13.0"/><circle class="wf-solid" cx="121.0" cy="1201.0" r="8.0"/></g>
<rect class="wf-guardbg" x="201.0" y="353.0" width="34.0" height="13" rx="2"/>
<text class="wf-guard" x="233.0" y="363.0" text-anchor="end">[yes]</text>
<g transform="rotate(-90 436.0 256.0)"><rect class="wf-guardbg" x="407.0" y="247.0" width="58.0" height="13" rx="2"/><text class="wf-guard" x="436.0" y="257.0" text-anchor="middle">[no: fix]</text></g>
</svg>
