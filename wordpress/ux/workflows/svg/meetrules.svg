<g class="wf-node wf-action" data-node="pattern"><rect class="wf-act wf-act-human" x="245.0" y="479" width="180" height="74" rx="9"/><text class="wf-text" x="335.0" y="497.5" text-anchor="middle">Edit weeks, day,</text><text class="wf-text" x="335.0" y="512.5" text-anchor="middle">start/end, time words,</text><text class="wf-text" x="335.0" y="527.5" text-anchor="middle">skip months, or fill the</text><text class="wf-text" x="335.0" y="542.5" text-anchor="middle">new card</text></g>
