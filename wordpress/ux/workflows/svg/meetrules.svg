<g class="wf-node wf-action" data-node="render"><rect class="wf-act wf-act-system" x="673.0" y="293" width="180" height="74" rx="9"/><text class="wf-text" x="763.0" y="311.5" text-anchor="middle">One card per meeting plus</text><text class="wf-text" x="763.0" y="326.5" text-anchor="middle">an empty &#x27;Add a meeting&#x27;</text><text class="wf-text" x="763.0" y="341.5" text-anchor="middle">card; snapshot of</text><text class="wf-text" x="763.0" y="356.5" text-anchor="middle">originals</text></g>
