<g class="wf-node wf-action" data-node="read"><rect class="wf-act wf-act-human" x="245.0" y="215" width="180" height="44" rx="9"/><text class="wf-text" x="335.0" y="233.5" text-anchor="middle">Read the sources; decide</text><text class="wf-text" x="335.0" y="248.5" text-anchor="middle">what changes</text><circle class="wf-pain" cx="421.0" cy="217" r="10.5"/><text class="wf-paintext" x="421.0" y="220.8" text-anchor="middle">O1</text></g>
<g class="wf-node wf-action" data-node="bk"><rect class="wf-act wf-act-human" x="245.0" y="293" width="180" height="44" rx="9"/><text class="wf-text" x="335.0" y="311.5" text-anchor="middle">ssh spokares-live; wp db</text><text class="wf-text" x="335.0" y="326.5" text-anchor="middle">export ~/backups/…</text></g>
<g class="wf-node wf-action" data-node="php"><rect class="wf-act wf-act-human" x="245.0" y="371" width="180" height="74" rx="9"/><text class="wf-text" x="335.0" y="389.5" text-anchor="middle">Write a PHP snippet:</text><text class="wf-text" x="335.0" y="404.5" text-anchor="middle">update_option(spk_rota /</text><text class="wf-text" x="335.0" y="419.5" text-anchor="middle">spk_meetings / spk_nets)</text><text class="wf-text" x="335.0" y="434.5" text-anchor="middle">or post edits</text></g>
<g class="wf-node wf-action" data-node="run"><rect class="wf-act wf-act-system" x="673.0" y="479" width="180" height="44" rx="9"/><text class="wf-text" x="763.0" y="497.5" text-anchor="middle">wp eval-file - runs the</text><text class="wf-text" x="763.0" y="512.5" text-anchor="middle">snippet</text></g>
<g class="wf-node wf-action" data-node="san"><rect class="wf-act wf-act-system" x="673.0" y="557" width="180" height="59" rx="9"/><text class="wf-text" x="763.0" y="575.5" text-anchor="middle">register_setting</text><text class="wf-text" x="763.0" y="590.5" text-anchor="middle">sanitisers reshape the</text><text class="wf-text" x="763.0" y="605.5" text-anchor="middle">option; cache purged</text></g>
<g class="wf-node wf-action" data-node="skip"><rect class="wf-act wf-act-system" x="673.0" y="650" width="180" height="74" rx="9"/><text class="wf-text" x="763.0" y="668.5" text-anchor="middle">Skipped: publish checks,</text><text class="wf-text" x="763.0" y="683.5" text-anchor="middle">call-sign check, conflict</text><text class="wf-text" x="763.0" y="698.5" text-anchor="middle">hashes, &#x27;Last saved&#x27;</text><text class="wf-text" x="763.0" y="713.5" text-anchor="middle">stamp, undo snapshot</text><circle class="wf-pain" cx="849.0" cy="652" r="10.5"/><text class="wf-paintext" x="849.0" y="655.8" text-anchor="middle">O1</text></g>
<g class="wf-node wf-action" data-node="live"><rect class="wf-act wf-act-external" x="887.0" y="758" width="180" height="34" rx="9"/><text class="wf-text" x="977.0" y="779.0" text-anchor="middle">Change is live</text></g>
<g class="wf-node wf-decision" data-node="ok"><path class="wf-dec" d="M335.0,826 L431.0,854.0 L335.0,882 L239.0,854.0 z"/><text class="wf-text" x="335.0" y="850.5" text-anchor="middle">Looks right on the</text><text class="wf-text" x="335.0" y="865.5" text-anchor="middle">site?</text></g>
<g class="wf-node wf-action" data-node="fix"><rect class="wf-act wf-act-human" x="459.0" y="916" width="180" height="59" rx="9"/><text class="wf-text" x="549.0" y="934.5" text-anchor="middle">Write a corrective</text><text class="wf-text" x="549.0" y="949.5" text-anchor="middle">snippet, or wp db import</text><text class="wf-text" x="549.0" y="964.5" text-anchor="middle">the backup</text></g>
<g class="wf-node wf-end" data-node="x"><circle class="wf-ring" cx="335.0" cy="945.5" r="13.0"/><circle class="wf-solid" cx="335.0" cy="945.5" r="8.0"/><text class="wf-cap" x="335.0" y="972.5" text-anchor="middle">Done; editors&#x27; screens show</text><text class="wf-cap" x="335.0" y="987.5" text-anchor="middle">stale &#x27;Last saved&#x27;</text></g>
